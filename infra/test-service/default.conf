server {
    listen 8081;
    server_name test-service localhost;

    access_log off;

    location = /ping {
        default_type application/json;
        return 200 '{"service":"sandbox-test-service","status":"ok"}';
    }

    location / {
        default_type application/json;
        return 200 '{"service":"sandbox-test-service","status":"ok"}';
    }
}
