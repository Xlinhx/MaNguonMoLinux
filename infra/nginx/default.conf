log_format sandbox_json escape=json
    '{"timestamp":"$time_iso8601",'
    '"run_id":"$http_x_sandbox_run_id",'
    '"request_id":"$http_x_sandbox_request_id",'
    '"seq":"$http_x_sandbox_seq",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time}';

server {
    listen 8080;
    server_name localhost;

    access_log /var/log/nginx/access.jsonl sandbox_json;
    error_log /var/log/nginx/error.log warn;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location = /demo {
        default_type application/json;
        return 200 '{"status":"ok","path":"/demo"}';
    }

    location = /missing {
        default_type application/json;
        return 404 '{"status":"not_found","path":"/missing"}';
    }

    location / {
        default_type application/json;
        return 404 '{"status":"not_found","path":"$uri"}';
    }
}
