name: sandbox-lab

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sandbox-lab-nginx
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../runtime/nginx-logs:/var/log/nginx
    networks:
      - sandbox_lab_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  test-service:
    image: nginx:1.27-alpine
    container_name: sandbox-lab-test-service
    ports:
      - "127.0.0.1:18081:8081"
    volumes:
      - ./test-service/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sandbox_lab_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  sandbox_lab_net:
    name: sandbox_lab_net
    driver: bridge
